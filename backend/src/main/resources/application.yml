server:
  port: 8080

spring:
  application:
    name: jira-backend
  profiles:
    active: local

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/jira?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    # 数据库账号密码不要写进仓库。本地开发二选一：
    #   1) 在 IDEA 运行配置的 Environment variables 里加  DB_USERNAME=root;DB_PASSWORD=你的密码
    #   2) 本文件临时填写（改完别提交）
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

mybatis:
  # MyBatis XML 放在 resources/mapper 下
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.jira
  configuration:
    # 数据库 snake_case -> Java camelCase，例如 person_id -> personId
    map-underscore-to-camel-case: true

jira:
  jwt:
    # 生产环境必须换成随机长字符串（至少 32 字符），并通过环境变量注入
    secret: ${JWT_SECRET:jira-backend-dev-secret-key-change-me-32bytes}
    # token 有效期（小时）；Cookie 的 Max-Age 自动跟它对齐
    expire-hours: 24
  auth:
    # 登录凭证 Cookie 名
    cookie-name: jira_token
    # 生产环境走 HTTPS 时必须改成 true（并建议把名字改成 __Host-jira_token）
    cookie-secure: false
    # 前后端同站（端口不同也算同站）用 Lax 即可；
    # 真跨站部署（前端在 A 域名、后端在 B 域名）需改为 None，且 cookie-secure 必须为 true
    cookie-same-site: Lax

logging:
  level:
    com.jira: debug
